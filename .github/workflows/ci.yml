name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Typecheck
        run: corepack yarn typecheck

      - name: Unit tests
        run: corepack yarn test:unit

      - name: Lint
        run: corepack yarn lint

      - name: Prepare test database
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: |
          corepack yarn prisma db push
          corepack yarn tsx scripts/ensure-test-admin.ts

      - name: Database integration tests
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: corepack yarn test:integration

      - name: Install Playwright browsers
        run: corepack yarn playwright install --with-deps chromium

      - name: Playwright smoke
        env:
          CI: true
          AUTH_SECRET: test-auth-secret
          NEXTAUTH_SECRET: test-nextauth-secret
          AUTH_TRUST_HOST: true
          JWT_SECRET: test-jwt-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
        run: corepack yarn test

